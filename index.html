<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/src/assets/CR_Tab_Icon-01.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CandyRific</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
  href="https://fonts.googleapis.com/css2?family=Fredoka:wdth,wght@75..125,300..700&display=swap"
  rel="stylesheet"
>


  </head>
  <body>
    <div id="app"></div>
    <form
      name="customer_form"
      method="POST"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
      hidden
    >
      <input
        type="hidden"
        name="form-name"
        value="customer_form"
      />

      <input
        type="text"
        name="bot-field"
      />

      <select name="customerType">
        <option value="Consumer">
          Consumer
        </option>
      </select>

      <select name="contactSubject">
        <option value="Customer Feedback">
          Customer Feedback
        </option>

        <option value="Sales - International">
          Sales - International
        </option>

        <option value="Sales - USA">
          Sales - USA
        </option>
      </select>

      <input
        type="text"
        name="firstName"
      />

      <input
        type="text"
        name="lastName"
      />

      <input
        type="email"
        name="email"
      />

      <input
        type="text"
        name="companyName"
      />

      <input
        type="text"
        name="address"
      />

      <input
        type="text"
        name="city"
      />

      <select name="state">
        <option value="">
          Choose...
        </option>
      </select>

      <input
        type="text"
        name="zipCode"
      />

      <textarea name="message"></textarea>
    </form>

    <!-- SALES FORM -->

    <form
      name="sales_form"
      method="POST"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
      hidden
    >
      <input
        type="hidden"
        name="form-name"
        value="sales_form"
      />

      <input
        type="text"
        name="bot-field"
      />

      <select name="customerType">
        <option value="Distributor">
          Distributor
        </option>

        <option value="Retail Store">
          Retail Store
        </option>
      </select>

      <select name="contactSubject">
        <option value="Customer Feedback">
          Customer Feedback
        </option>

        <option value="Sales - International">
          Sales - International
        </option>

        <option value="Sales - USA">
          Sales - USA
        </option>
      </select>

      <input
        type="text"
        name="firstName"
      />

      <input
        type="text"
        name="lastName"
      />

      <input
        type="email"
        name="email"
      />

      <input
        type="text"
        name="companyName"
      />

      <input
        type="text"
        name="address"
      />

      <input
        type="text"
        name="city"
      />

      <select name="state">
        <option value="">
          Choose...
        </option>
      </select>

      <input
        type="text"
        name="zipCode"
      />

      <textarea name="message"></textarea>
    </form>
    <script type="module" src="/src/main.js"></script>
    

  </body>
</html>
